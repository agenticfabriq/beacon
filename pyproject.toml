[project]
name = "beacon"
version = "0.2.0"
license = "Apache-2.0"
description = "Evaluation framework for database-grounded data agents"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-postgresql>=6.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    # Pinned exactly, not floored. A formatter is a build input: an unpinned
    # one reformats the repo on any release that changes a line-joining rule,
    # so `make lint` starts failing on a checkout nobody touched and stops
    # being read. 0.6 -> 0.15 drifted 27 files this way.
    "ruff==0.15.16",
    # Pinned for the same reason, one tool over: a type checker that acquires
    # new diagnostics on a lock refresh fails `make typecheck` on a checkout
    # nobody touched, which is how the 72 errors accumulated. The lock already
    # fixed it; the specifier now says so deliberately.
    "mypy==2.1.0",
    "httpx>=0.27",
    "statsmodels>=0.14",
    "responses>=0.25",
]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/beacon_storage/src",
    "packages/beacon_iam/src",
    "packages/beacon_ui/src",
    "packages/beacon_runner/src",
    "packages/beacon_graders/src",
    "packages/beacon_ablation/src",
    "packages/beacon_registry/src",
    "packages/beacon_sdk/src",
    "packages/beacon_workers/src",
    "packages/beacon_benchmarks/src",
    # `scripts/` is not a package and is imported by path at runtime
    # (`sys.path.insert` in the bootstrap-key test). Without it here, mypy
    # cannot resolve that import and the module goes unchecked -- while
    # `make typecheck` already runs over `scripts/`, so the file IS checked
    # and only its importers are not.
    "scripts",
]

[[tool.mypy.overrides]]
module = [
    "boto3",
    "botocore",
    "botocore.*",
    "mnemiq",
    "mnemiq.*",
    # Optional dev-only capture tooling, not a runtime or CI dependency.
    "playwright",
    "playwright.*",
    "uuid_extensions",
    "uuid_extensions.*",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "tests"]
addopts = "-v --strict-markers"
markers = ["integration: requires Postgres", "e2e: full plan-2 stack smoke"]
