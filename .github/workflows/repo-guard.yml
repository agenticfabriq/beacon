name: repo-guard
on:
  push:
  pull_request:

# Read-only: the guard scans the checkout and reports, and must never be able
# to write to the repository it is policing.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for proprietary names and secrets
        env:
          REPO_GUARD_NAME_PATTERNS: ${{ secrets.REPO_GUARD_NAME_PATTERNS }}
        run: bash scripts/repo-guard.sh --all
