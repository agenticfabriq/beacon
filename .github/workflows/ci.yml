name: CI

on:
  pull_request:
  push:
    branches: [main]

# The lint and typecheck jobs run the Makefile targets rather than repeating
# their commands. Repeating them is how CI came to check less than `make
# typecheck` did: the Makefile added scripts/ (deliberately -- the ablation
# runner's protocol had drifted for the repo's whole history while it sat
# outside the target) and this file was never updated to match.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --all-packages
      - name: Lint
        run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --all-packages
      - name: Typecheck
        run: make typecheck

  test:
    runs-on: ubuntu-latest
    env:
      BEACON_JWT_SIGNING_KEY: ci-test
    # The root conftest sets DATABASE_URL with `setdefault` and every package's
    # db_url fixture returns it when present, so the pytest-postgresql fallback
    # beneath it is unreachable and the suite ALWAYS wants a server at this
    # address. Locally that is the docker-compose Postgres; CI had none, and
    # started one only in the alembic step below -- after pytest had already
    # failed against it. Credentials match the conftest default exactly, so the
    # default is what gets exercised.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon_dev
          POSTGRES_DB: beacon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # No Postgres binaries installed here. They were, for pytest-postgresql's
      # `postgresql_proc` factories -- but nothing ever reaches those: the root
      # conftest sets DATABASE_URL unconditionally and every package's db_url
      # fixture returns it when present, so the factory branch beneath is
      # unreachable in all six packages. Dead weight, and worse than inert: the
      # Debian package's post-install starts a cluster on 5432, which is the
      # port this service container has already bound. It did not collide only
      # because the runner image ships postgresql-16 already, so apt did nothing
      # -- a green run resting on an image detail nobody chose.
      - name: Install
        run: uv sync --all-packages
      - name: Pytest
        run: uv run pytest -v
      - name: Smoke alembic against a fresh DB
        # A database of its own, created here rather than by initdb: the service
        # already owns :5432, and a second server on that port cannot bind. The
        # _ci suffix is what the conftest's wipe guard permits.
        env:
          DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@localhost:5432/beacon_ci
        run: |
          uv run python -c "
          import psycopg
          with psycopg.connect(
              'postgresql://beacon:beacon_dev@localhost:5432/postgres', autocommit=True
          ) as conn:
              conn.execute('DROP DATABASE IF EXISTS beacon_ci')
              conn.execute('CREATE DATABASE beacon_ci')
          "
          uv run alembic -c packages/beacon_storage/src/beacon_storage/migrations/alembic.ini upgrade head
