services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon_dev
      POSTGRES_DB: beacon
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "beacon"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
