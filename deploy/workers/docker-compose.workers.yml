services:
  migrate:
    build:
      context: .
      dockerfile: deploy/workers/Dockerfile
    command:
      [
        "python",
        "-m",
        "alembic",
        "-c",
        "packages/beacon_storage/src/beacon_storage/migrations/alembic.ini",
        "upgrade",
        "head",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@postgres:5432/beacon
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker-promotion:
    build:
      context: .
      dockerfile: deploy/workers/Dockerfile
    command: ["beacon-worker-promotion"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BEACON_OBJECT_STORAGE: local:///var/beacon-objects
      BEACON_WORKER_EMBEDDING_PROVIDER: hash
      BEACON_WORKER_LOG_LEVEL: INFO
      BEACON_WORKER_PROMOTION_INTERVAL_SECONDS: "3600"
      DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@postgres:5432/beacon
    ports: ["9101:9101"]
    volumes:
      - beacon-objects:/var/beacon-objects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-convergence:
    build:
      context: .
      dockerfile: deploy/workers/Dockerfile
    command: ["beacon-worker-convergence"]
    environment:
      BEACON_WORKER_CONVERGENCE_INTERVAL_SECONDS: "30"
      BEACON_WORKER_LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@postgres:5432/beacon
    ports: ["9102:9102"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-antigoodhart:
    build:
      context: .
      dockerfile: deploy/workers/Dockerfile
    command: ["beacon-worker-antigoodhart"]
    environment:
      BEACON_WORKER_ANTIGOODHART_INTERVAL_SECONDS: "300"
      BEACON_WORKER_LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@postgres:5432/beacon
    ports: ["9103:9103"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-retention:
    build:
      context: .
      dockerfile: deploy/workers/Dockerfile
    command: ["beacon-worker-retention"]
    environment:
      BEACON_OBJECT_STORAGE: local:///var/beacon-objects
      BEACON_WORKER_LOG_LEVEL: INFO
      BEACON_WORKER_RETENTION_DAYS: "90"
      BEACON_WORKER_RETENTION_INTERVAL_SECONDS: "86400"
      DATABASE_URL: postgresql+psycopg://beacon:beacon_dev@postgres:5432/beacon
    ports: ["9104:9104"]
    volumes:
      - beacon-objects:/var/beacon-objects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9104/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  beacon-objects:
