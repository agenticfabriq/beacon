[project]
name = "beacon_sdk"
version = "0.2.0"
license = "Apache-2.0"
description = "Beacon production-trace SDK - async-first, backpressure-aware"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_sdk"]
