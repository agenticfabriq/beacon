[project]
name = "beacon_runner"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "beacon_iam",
    "beacon_graders",
    "pydantic>=2.7",
    "click>=8.1",
]

[tool.uv.sources]
beacon_storage = { workspace = true }
beacon_iam = { workspace = true }
beacon_graders = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_runner"]
