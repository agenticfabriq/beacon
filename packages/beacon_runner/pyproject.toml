[project]
name = "beacon_runner"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "beacon_iam",
    "beacon_graders",
    "pydantic>=2.7",
    "click>=8.1",
]

# SUTs beacon ships, discoverable via `beacon suts list`. A SUT beacon does not
# ship is reachable without packaging metadata via `--sut-factory module:attr`.
# The mnemiq entries import cleanly without mnemiq installed; that package is
# imported lazily inside the SUT, and is deliberately not a beacon dependency.
[project.entry-points."beacon.suts"]
dummy = "beacon_runner.dummy_sut:DummySUT"
mnemiq-inprocess = "beacon_runner.sut.mnemiq:MnemiqInProcessSUT"
mnemiq-http-sql = "beacon_runner.sut.mnemiq:MnemiqHttpSqlSUT"
reference-langchain-sql = "beacon_runner.sut.reference:LangchainSqlSUT"
reference-llama-index-sql = "beacon_runner.sut.reference:LlamaIndexSqlSUT"
reference-spider-agent-lite = "beacon_runner.sut.reference:SpiderAgentLiteSUT"

[tool.uv.sources]
beacon_storage = { workspace = true }
beacon_iam = { workspace = true }
beacon_graders = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_runner"]
