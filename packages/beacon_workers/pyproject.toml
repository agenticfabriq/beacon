[project]
name = "beacon_workers"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "beacon_registry",
    "beacon_graders",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "tenacity>=8.5",
    "apscheduler>=3.10",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.scripts]
beacon-worker-promotion = "beacon_workers.promotion.__main__:main"
beacon-worker-convergence = "beacon_workers.convergence.__main__:main"
beacon-worker-retention = "beacon_workers.retention.__main__:main"

[tool.uv.sources]
beacon_storage = { workspace = true }
beacon_registry = { workspace = true }
beacon_graders = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_workers"]
