# Hierarchical rubric for InsightBench summary grading.
dimensions:
  faithfulness:
    weight: 0.35
    description: "Does the summary stay faithful to the underlying data?"
    criteria:
      no_fabricated_numbers:
        description: "Numbers cited appear in or are derivable from the source data."
        scale: [0, 5]
      no_unsupported_claims:
        description: "Qualitative claims are supported by the data."
        scale: [0, 5]
  coverage:
    weight: 0.30
    description: "Does the summary cover the key analytical findings?"
    criteria:
      top_finding_present:
        description: "The most important finding from gold is mentioned."
        scale: [0, 5]
      secondary_findings_present:
        description: "Secondary findings from gold appear in the summary."
        scale: [0, 5]
  clarity:
    weight: 0.20
    description: "Is the summary clearly written and well-structured?"
    criteria:
      organization:
        description: "Findings are organized into coherent sections."
        scale: [0, 5]
      readability:
        description: "Language is concise and unambiguous."
        scale: [0, 5]
  actionability:
    weight: 0.15
    description: "Are recommendations grounded and useful?"
    criteria:
      recommendations_grounded:
        description: "Recommendations cite the data driving them."
        scale: [0, 5]
      recommendations_specific:
        description: "Recommendations are specific rather than generic."
        scale: [0, 5]
