[project]
name = "beacon_ui"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "beacon_iam",
    "beacon_runner",
    "beacon_graders",
    "beacon_registry",
    "beacon_ablation",
    "beacon_benchmarks",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "plotly>=5.22",
    "pandas>=2.2",
    "rich>=13.7",
]

[project.scripts]
beacon = "beacon_ui.cli.main:cli"
beacon-api = "beacon_ui.api.app:app"

[tool.uv.sources]
beacon_storage = { workspace = true }
beacon_iam = { workspace = true }
beacon_runner = { workspace = true }
beacon_graders = { workspace = true }
beacon_registry = { workspace = true }
beacon_ablation = { workspace = true }
beacon_benchmarks = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_ui"]
