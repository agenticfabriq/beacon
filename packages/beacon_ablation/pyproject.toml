[project]
name = "beacon_ablation"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "beacon_runner",
    "beacon_graders",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
beacon_storage = { workspace = true }
beacon_runner = { workspace = true }
beacon_graders = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_ablation"]
