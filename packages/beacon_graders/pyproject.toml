[project]
name = "beacon_graders"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_runner",
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[tool.uv.sources]
beacon_runner = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_graders"]
