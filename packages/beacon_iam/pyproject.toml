[project]
name = "beacon_iam"
version = "0.2.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "beacon_storage",
    "pydantic>=2.7",
    "bcrypt>=4.1",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.uv.sources]
beacon_storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_iam"]
